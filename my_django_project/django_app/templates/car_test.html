{% for car in cars %}

    <li>
        <p><a href="{% url 'car_detail' car.pk %}">Название: {{car.car_name}}</a></p>
        <p>Цена: {{car.price}}$</p>
        <p>Год выпуска: {{car.year}}</p>
        <p>Цвет: {{car.color}}</p>
        <p>Дата публикации: {{car.created_data}}</p>
    </li>

{% endfor %}
